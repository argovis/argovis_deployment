apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: argovis-prom
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: argovis-drifter-prom-atoc-argovis-dev.apps.containers02.colorado.edu
  to:
    kind: Service
    name: prom
    weight: 100
  port:
    targetPort: 9090
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: None
  wildcardPolicy: None
status:
  ingress:
    - host: argovis-drifter-prom-atoc-argovis-dev.apps.containers02.colorado.edu
      routerName: default
      routerCanonicalHostname: apps.containers02.colorado.edu


